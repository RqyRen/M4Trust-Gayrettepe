name: CI

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    # Weekly cross-repo contract drift check against Spring (see the
    # contract-drift job below) -- Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test-and-validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # tesseract-ocr: OCR fallback tests (app/pipeline/document_extraction);
      # matches the runtime packages installed in the production Dockerfile.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur libglib2.0-0 libgomp1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate contract schemas
        run: python contracts/scripts/validate_contracts.py

      # Contract sync-drift manifest (contracts/.sync-manifest.json): catches
      # a contract file being hand-edited without going through a `--sync`
      # against Spring's repo. This only compares against the LAST recorded
      # sync -- it does not by itself detect Spring changing something
      # upstream since then. The `contract-drift` job below does that (real
      # cross-repo check, runs weekly + on demand, separate from this job so
      # every push doesn't depend on Spring's repo being reachable).
      - name: Check contract sync-drift manifest
        run: python contracts/scripts/check_drift.py --check

      # Redis/RabbitMQ/MinIO-backed tests skip gracefully when that
      # infrastructure isn't reachable (pytest.mark.skipif) -- this runner
      # doesn't run docker-compose, so those are expected to skip here, not
      # fail. They're exercised locally against real infra during development
      # (see individual PR descriptions).
      - name: Run test suite
        run: python -m pytest -q

  contract-drift:
    name: Cross-repo contract drift check (Spring)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # m4trust-spring-front-prod (gencberke) is a public repo -- no
      # credentials needed, plain checkout works (verified 20 Jul 2026, see
      # contracts/scripts/check_drift.py docstring).
      - name: Checkout Spring repo
        uses: actions/checkout@v4
        with:
          repository: gencberke/m4trust-spring-front-prod
          path: spring-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Real byte-for-byte diff against Spring's current contracts/. Fails
      # (non-zero exit) if anything differs -- this is the actual "did Spring
      # change something we haven't synced yet" check; the --check step in
      # test-and-validate above only catches local hand-edits since the last
      # sync. On failure: someone should review the diff (see job log),
      # decide if it's a real change, and run `check_drift.py --sync
      # <path-to-spring-checkout>` locally to update the manifest via a PR --
      # this job intentionally does not write/commit anything itself.
      - name: Diff contracts/ against Spring's current repo
        run: python contracts/scripts/check_drift.py --sync spring-repo
